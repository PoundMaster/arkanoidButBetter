<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Неон Арканоид</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="bg-fx" aria-hidden="true"></div>
<div class="bg-vignette" aria-hidden="true"></div>

<div class="page">
  <header class="topbar">
    <div class="logo">НЕОН<span>·</span>АРКАНОИД</div>
    <div class="record-chip" title="Личный рекорд">РЕКОРД <b id="recordVal">0</b></div>
  </header>

  <div class="hud">
    <div class="chip">ОЧКИ <b id="scoreVal">0</b></div>
    <div class="chip">ЭТАП <b id="stageVal">–</b></div>
    <div class="chip">ЖИЗНИ <span class="lives" id="livesVal">–</span></div>
    <div class="chip">РАССТАНОВКА <b id="layoutVal">–</b></div>
    <div class="chip auto hidden" id="autoChip">АВТОПИЛОТ</div>
    <button class="btn btn-ghost" id="restartBtn" title="Начать игру заново с 1-го этапа">⟲ Заново</button>
  </div>

  <div class="frame" id="frameWrap">
    <canvas id="game" width="720" height="920"></canvas>
    <div class="banner" id="banner"></div>
  </div>

  <footer class="hints">
    <span id="ctrlHint"><kbd>Мышь</kbd> платформа · <kbd>ЛКМ</kbd> → стрелки</span>
    <span><kbd>Enter</kbd> запуск шара</span>
    <span><kbd>Esc</kbd> пауза</span>
    <span><kbd>Пробел</kbd> автопилот (тест)</span>
    <span><kbd>F12</kbd> pickLayoutForStage(этап, 0–5)</span>
  </footer>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel" id="overlayPanel"></div>
</div>

<script src="js/config.js"></script>
<script src="js/layouts.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/debug.js"></script>
<script src="js/main.js"></script>
</body>
</html>
